name: Production E2E

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Production or staging URL
        required: false
        default: https://new.soundz.uz
  schedule:
    - cron: "15 2 * * *"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Yangi platforma turgan domen. soundz.uz'da hozircha ESKI WordPress sayt
      # ishlaydi — unga qarshi smoke test o'tkazish ma'nosiz. Ko'chishdan keyin
      # repo o'zgaruvchisi (vars.E2E_BASE_URL) bilan almashtiriladi.
      E2E_BASE_URL: ${{ inputs.base_url || vars.E2E_BASE_URL || 'https://new.soundz.uz' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # playwright.config.ts `@playwright/test` ni repo'dan import qiladi —
      # o'rnatishsiz konfiguratsiya yuklanmaydi va test umuman ishga tushmaydi.
      - run: pnpm install --frozen-lockfile --reporter=silent
      - run: pnpm e2e:install
      - run: pnpm e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
