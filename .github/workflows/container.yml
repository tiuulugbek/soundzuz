name: Container

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # DIQQAT: NEXT_PUBLIC_* qiymatlari brauzer bundle'iga SHU YERDA,
          # build vaqtida singdiriladi — serverdagi .env ularni o'zgartira olmaydi.
          #
          # API manzili NISBIY: brauzer doim sayt turgan domenga murojaat qiladi
          # (gateway /v1/ ni api konteynerga uzatadi). Shu sabab new.soundz.uz'da
          # ham, soundz.uz'ga ko'chgandan keyin ham qayta build kerak emas.
          # Ilgari bu yerda api.soundz.uz turgan edi — u domen uchun DNS yo'q va
          # saytdagi barcha formalar jimgina uzilib qolgan edi.
          build-args: |
            NEXT_PUBLIC_API_URL=/v1
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://soundz.uz' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
